<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regjistrohu | Thriftizy</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.9);
            --glass-border: rgba(255, 255, 255, 0.5);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            background: #f8fafc;
            overflow-x: hidden;
        }

        /* Animated Mesh Gradient Background */
        .auth-bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            background-color: #f8fafc;
            background-image: 
                radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(59, 130, 246, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.12) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(59, 130, 246, 0.12) 0px, transparent 50%);
            animation: bgShift 15s ease infinite alternate;
        }

        @keyframes bgShift {
            0% { background-position: 0% 0%; }
            100% { background-position: 100% 100%; }
        }

        .auth-page-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 60px 20px;
        }

        .auth-card {
            background: var(--glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            width: 100%;
            max-width: 480px;
            padding: 50px 45px;
            border-radius: 40px;
            box-shadow: 0 35px 70px -15px rgba(15, 23, 42, 0.12);
            border: 1px solid var(--glass-border);
            text-align: center;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .auth-logo {
            font-size: 2.8rem;
            font-weight: 800;
            color: #0f172a;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 8px;
            letter-spacing: -1.5px;
        }

        .auth-logo span {
            color: #10b981;
        }

        .auth-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 30px;
            color: #64748b;
        }

        .auth-form .input-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .auth-form .input-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .auth-form label {
            display: block;
            font-size: 0.75rem;
            font-weight: 800;
            color: #475569;
            margin-bottom: 8px;
            margin-left: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .auth-form input, .auth-form select {
            width: 100%;
            box-sizing: border-box;
            padding: 16px 22px;
            border-radius: 18px;
            border: 2px solid #e2e8f0;
            background: rgba(255, 255, 255, 0.7);
            font-family: inherit;
            font-size: 0.95rem;
            color: #0f172a;
            transition: all 0.3s ease;
        }

        .auth-form input:focus, .auth-form select:focus {
            outline: none;
            border-color: #10b981;
            background: white;
            box-shadow: 0 0 0 5px rgba(16, 185, 129, 0.1);
        }

        .btn-auth-submit {
            background: #0f172a;
            color: white;
            width: 100%;
            padding: 18px;
            border-radius: 20px;
            border: none;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 15px;
            box-shadow: 0 15px 30px -8px rgba(15, 23, 42, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-auth-submit:hover {
            background: #10b981;
            transform: translateY(-3px);
            box-shadow: 0 20px 40px -10px rgba(16, 185, 129, 0.4);
        }

        .auth-toggle {
            margin-top: 35px;
            font-size: 0.95rem;
            color: #64748b;
            font-weight: 600;
        }

        .auth-toggle a {
            color: #10b981;
            text-decoration: none;
            font-weight: 800;
            margin-left: 5px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-top: 25px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 700;
            transition: all 0.3s;
        }

        .back-link:hover {
            color: #475569;
            transform: translateX(-5px);
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 500px) {
            .auth-form .input-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="auth-bg"></div>
    <div class="auth-page-container">
        <div class="auth-card">
            <a href="index.html" class="auth-logo">THRIFT<span>IZY</span></a>
            <p class="auth-title">Krijo llogarinë tënde në komunitet</p>

            <form class="auth-form" id="signup-form">
                <div class="input-group">
                    <label>Emri i Plotë</label>
                    <input type="text" id="signup-name" placeholder="Filan Fisteku" required>
                </div>
                
                <div class="input-row">
                    <div class="input-group" style="margin-bottom:0;">
                        <label>Shteti</label>
                        <select id="signup-country" required>
                            <option value="">Zgjidh</option>
                            <option value="ks">Kosovë</option>
                            <option value="al">Shqipëri</option>
                            <option value="mk">Maqedoni</option>
                        </select>
                    </div>
                    <div class="input-group" style="margin-bottom:0;">
                        <label>Qyteti</label>
                        <div id="signup-city-container">
                            <input type="text" id="signup-city" placeholder="p.sh. Prishtinë" required disabled>
                        </div>
                    </div>
                </div>

                <div class="input-group">
                    <label>Email-i</label>
                    <input type="email" id="signup-email" placeholder="emri@shembull.com" required>
                </div>

                <div class="input-row">
                    <div class="input-group" style="margin-bottom:0;">
                        <label>Fjalëkalimi</label>
                        <input type="password" id="signup-password" placeholder="••••••••" required minlength="6">
                    </div>
                    <div class="input-group" style="margin-bottom:0;">
                        <label>Konfirmo</label>
                        <input type="password" id="signup-confirm-password" placeholder="••••••••" required minlength="6">
                    </div>
                </div>

                <button type="submit" class="btn-auth-submit" id="signup-btn">Regjistrohu Tani</button>
            </form>

            <div class="auth-toggle">
                Keni një llogari? <a href="login.html">Hyni këtu</a>
            </div>

            <a href="index.html" class="back-link">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                Kthehu prapa
            </a>
        </div>
    </div>

    <script type="module">
        import { auth, db, createUserWithEmailAndPassword, doc, setDoc } from './firebase-config.js';

        const signupForm = document.getElementById('signup-form');
        const signupBtn = document.getElementById('signup-btn');
        const countrySelect = document.getElementById('signup-country');
        const cityContainer = document.getElementById('signup-city-container');

        const mkCities = ["Berovë", "Manastir", "Vallandovë", "Veles", "Vinicë", "Gjevgjeli", "Gostivar", "Dibrë", "Dellçevë", "Demir Hisar", "Kavadar", "Kërçovë", "Koçan", "Kratovë", "Kriva Pallankë", "Krushevë", "Kumanovë", "Brod", "Negotinë", "Ohër", "Prilep", "Probishtip", "Radovisht", "Resnjë", "Sveti Nikollë", "Shkup", "Strugë", "Strumicë", "Tetovë", "Shtip"];
        const ksCities = ["Artanë", "Besianë", "Burim", "Dardanë", "Deçan", "Dragash", "Drenas", "Ferizaj", "Fushë Kosovë", "Gjakovë", "Gjilan", "Kastriot", "Kaçanik", "Klinë", "Leposaviq", "Lipjan", "Malishevë", "Mitrovicë", "Pejë", "Prishtinë", "Prizren", "Rahovec", "Skenderaj", "Shtërpcë", "Shtime", "Therandë", "Viti", "Vushtrri", "Zubin Potok", "Zveçan"];
        const alCities = ["Berat", "Bulqizë", "Delvinë", "Devoll", "Dibër", "Durrës", "Elbasan", "Fier", "Gramsh", "Gjirokastër", "Has", "Kavajë", "Kolonjë", "Korçë", "Krujë", "Kucovë", "Kukës", "Kurbin", "Lezhë", "Librazhd", "Lushnjë", "Malësi e Madhe", "Mallakastër", "Mat", "Mirditë", "Peqin", "Përmet", "Pogradec", "Pukë", "Sarandë", "Skrapar", "Shkodër", "Tepelenë", "Tiranë", "Tropojë", "Vlorë"];

        countrySelect.addEventListener('change', () => {
            const country = countrySelect.value;
            if (!country) {
                cityContainer.innerHTML = `<input type="text" id="signup-city" placeholder="Zgjidh shtetin më parë" required disabled>`;
                return;
            }

            let cities = [];
            if (country === 'ks') cities = ksCities;
            else if (country === 'al') cities = alCities.sort();
            else if (country === 'mk') cities = mkCities.sort();

            let options = '<option value="">Zgjidh qytetin</option>';
            cities.forEach(c => {
                options += `<option value="${c}">${c}</option>`;
            });
            cityContainer.innerHTML = `<select id="signup-city" required>${options}</select>`;
        });

        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('signup-name').value.trim();
            const email = document.getElementById('signup-email').value.trim();
            const password = document.getElementById('signup-password').value;
            const confirmPassword = document.getElementById('signup-confirm-password').value;
            const country = document.getElementById('signup-country').value;
            const city = document.getElementById('signup-city').value;

            if (password !== confirmPassword) {
                alert('Fjalëkalimet nuk përputhen!');
                return;
            }

            if (!name || !email || !password || !country || !city) {
                alert('Ju lutem plotësoni të gjitha fushat.');
                return;
            }

            const originalText = signupBtn.textContent;
            signupBtn.innerHTML = '<div class="spinner"></div> Duke u procesuar...';
            signupBtn.disabled = true;

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                await setDoc(doc(db, "users", user.uid), {
                    fullName: name,
                    email: email,
                    uid: user.uid,
                    country: country,
                    city: city,
                    createdAt: new Date().toISOString(),
                    role: 'user'
                });

                // Ruajme shtetin edhe ne localStorage per nevojat e faqes
                localStorage.setItem('thriftizy_country', country);

                signupBtn.style.background = '#10b981';
                signupBtn.textContent = 'Sukses!';
                
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1000);

            } catch (error) {
                console.error("GABIM:", error);
                let message = 'Gabim gjatë regjistrimit.';
                if (error.code === 'auth/email-already-in-use') message = 'Ky email është i regjistruar më parë.';
                else message = error.message;
                
                alert('GABIM: ' + message);
                signupBtn.innerHTML = originalText;
                signupBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
