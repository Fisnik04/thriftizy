<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyr / Regjistrohu | Thriftizy</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background: #f8fafc;
        }
        .login-page-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .login-card {
            background: white;
            width: 100%;
            max-width: 450px;
            padding: 50px 40px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.05);
            border: 1px solid rgba(0,0,0,0.03);
            text-align: center;
        }
        .login-logo {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--primary);
            text-decoration: none;
            display: inline-block;
            margin-bottom: 30px;
        }
        .login-logo span {
            color: var(--accent);
        }
        .login-title {
            font-size: 1.5rem;
            margin-bottom: 30px;
            color: var(--text-main);
        }
        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--secondary);
            background: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            margin-bottom: 15px;
        }
        .social-btn:hover {
            background: #f1f5f9;
        }
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 20px 0;
            color: var(--text-muted);
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--secondary);
        }
        .divider:not(:empty)::before { margin-right: .25em; }
        .divider:not(:empty)::after { margin-left: .25em; }
        
        .login-form input {
            width: 100%;
            padding: 15px 20px;
            border-radius: 12px;
            border: 1px solid var(--secondary);
            background: #f8fafc;
            font-family: inherit;
            font-size: 1rem;
            transition: var(--transition);
            margin-bottom: 15px;
        }
        .login-form input:focus {
            outline: none;
            border-color: var(--accent);
            background: white;
        }
        .btn-submit {
            background: var(--primary);
            color: white;
            width: 100%;
            padding: 15px;
            border-radius: 50px;
            border: none;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 10px;
        }
        .btn-submit:hover {
            background: #0f172a;
        }
        .login-footer {
            margin-top: 20px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        .login-footer a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="login-page-container">
        <div class="login-card reveal">
            <a href="index.html" class="login-logo">THRIFT<span>IZY</span></a>
            <h1 class="login-title">Mirësevini përsëri</h1>
            
            <button class="social-btn">
                <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="Google" width="20">
                Vazhdo me Google
            </button>
            <button class="social-btn">
                <img src="https://upload.wikimedia.org/wikipedia/commons/f/fa/Apple_logo_black.svg" alt="Apple" width="18">
                Vazhdo me Apple
            </button>

            <div class="divider">ose</div>

            <form class="login-form" onsubmit="event.preventDefault(); window.location.href='index.html';">
                <input type="email" placeholder="Email-i juaj" required>
                <input type="password" placeholder="Fjalëkalimi" required>
                <button type="submit" class="btn-submit">Kyçu</button>
            </form>

            <div class="login-footer">
                Nuk keni llogari? <a href="#">Regjistrohu këtu</a>
            </div>
            <div class="login-footer" style="margin-top: 10px;">
                <a href="index.html" style="color: var(--text-muted); font-weight: normal;">&larr; Kthehu në dyqan</a>
            </div>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
