<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyr | Thriftizy</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.9);
            --glass-border: rgba(255, 255, 255, 0.5);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            background: #f8fafc;
            overflow-x: hidden;
        }

        /* Animated Mesh Gradient Background */
        .auth-bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            background-color: #f8fafc;
            background-image: 
                radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(59, 130, 246, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.12) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(59, 130, 246, 0.12) 0px, transparent 50%);
            animation: bgShift 15s ease infinite alternate;
        }

        @keyframes bgShift {
            0% { background-position: 0% 0%; }
            100% { background-position: 100% 100%; }
        }

        .login-page-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-card {
            background: var(--glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            width: 100%;
            max-width: 440px;
            padding: 60px 45px;
            border-radius: 40px;
            box-shadow: 0 35px 70px -15px rgba(15, 23, 42, 0.1);
            border: 1px solid var(--glass-border);
            text-align: center;
            transform: translateY(0);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .login-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 45px 80px -20px rgba(15, 23, 42, 0.15);
        }

        .login-logo {
            font-size: 2.8rem;
            font-weight: 800;
            color: #0f172a;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 8px;
            letter-spacing: -1.5px;
        }

        .login-logo span {
            color: #10b981;
        }

        .login-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 40px;
            color: #64748b;
            letter-spacing: 0.5px;
        }

        .social-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 30px;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 15px;
            border-radius: 18px;
            border: 1.5px solid #e2e8f0;
            background: white;
            font-size: 0.9rem;
            font-weight: 700;
            color: #1e293b;
            cursor: pointer;
            transition: all 0.2s;
        }

        .social-btn:hover {
            border-color: #10b981;
            background: #f0fdf4;
            transform: translateY(-2px);
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 30px 0;
            color: #94a3b8;
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 2px solid #f1f5f9;
        }

        .divider:not(:empty)::before { margin-right: 1.5em; }
        .divider:not(:empty)::after { margin-left: 1.5em; }
        
        .login-form .input-group {
            text-align: left;
            margin-bottom: 24px;
        }

        .login-form label {
            display: block;
            font-size: 0.75rem;
            font-weight: 800;
            color: #475569;
            margin-bottom: 10px;
            margin-left: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .login-form input {
            width: 100%;
            box-sizing: border-box;
            padding: 18px 24px;
            border-radius: 20px;
            border: 2px solid #e2e8f0;
            background: rgba(255, 255, 255, 0.7);
            font-family: inherit;
            font-size: 1rem;
            color: #0f172a;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .login-form input:focus {
            outline: none;
            border-color: #10b981;
            background: white;
            box-shadow: 0 0 0 5px rgba(16, 185, 129, 0.1);
        }

        .btn-submit {
            background: #0f172a;
            color: white;
            width: 100%;
            padding: 20px;
            border-radius: 22px;
            border: none;
            font-size: 1.15rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            margin-top: 10px;
            box-shadow: 0 15px 30px -8px rgba(15, 23, 42, 0.25);
        }

        .btn-submit:hover {
            background: #10b981;
            transform: translateY(-3px);
            box-shadow: 0 20px 40px -10px rgba(16, 185, 129, 0.4);
        }

        .btn-submit:active {
            transform: translateY(-1px);
        }

        .login-footer {
            margin-top: 40px;
            font-size: 0.95rem;
            color: #64748b;
            font-weight: 600;
        }

        .login-footer a {
            color: #10b981;
            text-decoration: none;
            font-weight: 800;
            transition: color 0.2s;
            padding-left: 5px;
        }

        .login-footer a:hover {
            color: #059669;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-top: 30px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 700;
            transition: all 0.3s;
        }

        .back-link:hover {
            color: #475569;
            transform: translateX(-5px);
        }
    </style>
</head>
<body>
    <div class="auth-bg"></div>
    <div class="login-page-container">
        <div class="login-card reveal">
            <a href="index.html" class="login-logo">THRIFT<span>IZY</span></a>
            <p class="login-title">Vazhdo me llogarinë tënde</p>
            
            <div class="social-grid">
                <button class="social-btn" type="button">
                    <svg width="20" height="20" viewBox="0 0 24 24">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                    </svg>
                    Google
                </button>
                <button class="social-btn" type="button">
                    <svg width="18" height="18" viewBox="0 0 384 512">
                        <path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z" fill="#000000"/>
                    </svg>
                    Apple
                </button>
            </div>

            <div class="divider">ose përdor emailin</div>

            <form class="login-form" id="login-form">
                <div class="input-group">
                    <label>Email-i juaj</label>
                    <input type="email" id="login-email" placeholder="emri@shembull.com" required>
                </div>
                <div class="input-group">
                    <label>Fjalëkalimi</label>
                    <input type="password" id="login-password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-submit" id="login-btn">Kyçu Tani</button>
            </form>

            <div class="login-footer">
                Nuk keni llogari? <a href="signup.html">Regjistrohu këtu</a>
            </div>
            
            <a href="index.html" class="back-link">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                Kthehu në dyqan
            </a>
        </div>
    </div>
    <script type="module" src="main.js"></script>
    <script type="module">
        import { auth, signInWithEmailAndPassword, onAuthStateChanged } from './firebase-config.js';

        const loginForm = document.getElementById('login-form');
        const loginBtn = document.getElementById('login-btn');
        const emailInput = document.getElementById('login-email');
        const passwordInput = document.getElementById('login-password');

        const redirectTo = new URLSearchParams(window.location.search).get('redirect') || 'profile.html';

        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.location.href = redirectTo;
            }
        });

        loginForm.addEventListener('submit', async (event) => {
            event.preventDefault();

            const email = emailInput.value.trim();
            const password = passwordInput.value;
            if (!email || !password) {
                alert('Ju lutem plotësoni email-in dhe fjalëkalimin.');
                return;
            }

            const originalText = loginBtn.textContent;
            loginBtn.disabled = true;
            loginBtn.textContent = 'Duke u kyçur...';

            try {
                await signInWithEmailAndPassword(auth, email, password);
                window.location.href = redirectTo;
            } catch (error) {
                let message = 'Kyçja dështoi. Provoni përsëri.';
                if (error.code === 'auth/invalid-credential') {
                    message = 'Email ose fjalëkalim i pasaktë.';
                } else if (error.code === 'auth/too-many-requests') {
                    message = 'Shumë tentativa. Provoni pas pak.';
                } else if (error.code === 'auth/user-disabled') {
                    message = 'Kjo llogari është çaktivizuar.';
                }
                alert(message);
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = originalText;
            }
        });
    </script>
</body>
</html>
