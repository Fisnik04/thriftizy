<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arkëtimi | Thriftizy</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .checkout-container {
            padding: 120px 5% 100px;
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 40px;
        }
        .checkout-steps {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        .step-title {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: var(--text-main);
            border-bottom: 1px solid var(--secondary);
            padding-bottom: 10px;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .order-summary {
            background: #f8fafc;
            padding: 40px;
            border-radius: 20px;
            height: fit-content;
        }
        .summary-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 1rem;
        }
        .summary-total {
            border-top: 2px solid var(--secondary);
            padding-top: 15px;
            margin-top: 15px;
            font-size: 1.4rem;
            font-weight: 800;
        }
    </style>
</head>
<body>
    <nav id="navbar" class="scrolled">
        <a href="index.html" class="logo">THRIFT<span>IZY</span></a>
        <div class="nav-actions">
            <button class="btn-secondary" onclick="history.back()">Kthehu</button>
        </div>
    </nav>

    <div class="checkout-container reveal">
        <div class="checkout-steps">
            <h2 class="step-title">1. Të dhënat e dërgesës</h2>
            <div class="form-row">
                <div class="form-group"><label>Emri</label><input type="text" placeholder="Emri juaj"></div>
                <div class="form-group"><label>Mbiemri</label><input type="text" placeholder="Mbiemri juaj"></div>
            </div>
            <div class="form-group"><label>Adresa</label><input type="text" placeholder="Rruga, Lagjja"></div>
            <div class="form-row">
                <div class="form-group"><label>Qyteti</label><input type="text" placeholder="Qyteti"></div>
                <div class="form-group">
                    <label>Shteti</label>
                    <select>
                        <option>Kosovë</option>
                        <option>Shqipëri</option>
                        <option>Maqedoni e Veriut</option>
                    </select>
                </div>
            </div>

            <h2 class="step-title" style="margin-top: 40px;">2. Mënyra e pagesës</h2>
            <div class="form-group">
                <label style="display: flex; align-items: center; gap: 10px; padding: 15px; border: 1px solid var(--secondary); border-radius: 10px; cursor: pointer; margin-bottom: 10px;">
                    <input type="radio" name="payment" checked> Paguaj në dorëzim (CASH)
                </label>
                <label style="display: flex; align-items: center; gap: 10px; padding: 15px; border: 1px solid var(--secondary); border-radius: 10px; cursor: pointer;">
                    <input type="radio" name="payment"> Kartë Bankare / PayPal
                </label>
            </div>
        </div>

        <div class="order-summary">
            <h2 class="step-title">Përmbledhja e Porosisë</h2>
            <div class="summary-item">
                <span id="checkout-subtotal-label">Nëntotali (0 artikuj)</span>
                <span id="checkout-subtotal-price">0.00€</span>
            </div>
            <div class="summary-item">
                <span>Dërgesa</span>
                <span>2.00€</span>
            </div>
            <div class="summary-item">
                <span style="color: var(--accent);">Kupon zbritje</span>
                <span style="color: var(--accent);">-5.00€</span>
            </div>
            <div class="summary-item summary-total">
                <span>Totali</span>
                <span id="checkout-total-price" style="color: var(--primary);">0.00€</span>
            </div>
            <button class="btn-buy" id="btn-confirm-checkout" style="width: 100%; margin-top: 20px;">Konfirmo Porosinë</button>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
